name: Generate Diagram

on:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Diagram from Code

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Diagram Generator
        id: generate
        uses: your-org/your-diagram-action@v1
        with:
          entryPoint: './src/diagram.js'
          args: '--theme dark'
          github_user_name: 'shanto'
          gif_out_path: './output/diagram.gif'
          svg_out_path: './output/diagram.svg'

      - name: Upload SVG Artifact
        uses: actions/upload-artifact@v3
        with:
          name: diagram-svg
          path: ./output/diagram.svg

      - name: Upload GIF Artifact
        uses: actions/upload-artifact@v3
        with:
          name: diagram-gif
          path: ./output/diagram.gif
